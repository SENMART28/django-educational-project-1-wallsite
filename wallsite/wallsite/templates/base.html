{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title_page }}</title>
    <link rel="stylesheet" href="{% static 'css/pico.min.css' %}">
</head>
<body>
    <header class="container">
        <nav>
            <a href="{% url 'wallapp:home' %}">Главная</a> | 
            <a href="{% url 'wallapp:add_page' %}">Создать пост</a> | 
            {% if request.user.is_authenticated %}
                <a href="{% url "users:profile" user.id%}">{{request.user.username}}</a> | 
                <form action='{% url "users:logout" %}', method='post', style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'users:register' %}">Регистрация</a> | 
                <a href="{% url "users:login" %}">Войти</a>
            {% endif %}
        </nav>
    </header>

    <main class="container" style="max-width: 800px;">
        {% block content %}
        {% endblock %}

        {% block navigation %}
        {% endblock navigation %}
    </main>

    <footer class="container" style="max-width: 800px; text-align: center; margin-top: 40px;">
        <p>&copy; 2026 Моя Стенка</p>
    </footer>

</body>
</html>
