{% extends "base.html" %}

{% block content %}
    <h1>Настройки профиля</h1>

<form method='post' enctype='multipart/form-data'>
    {% csrf_token %}
    <div>{{form.non_field_errors}}</div>
    {% for f in form %}
        <p><label for='{{f.id_for_label}}'>{{ f.label }}</label>{{ f }}</p>
        <div>{{ f.errors }}</div>
    {% endfor %}
    <p><button type='submit'>Изменить</button></p>

    <p><a href='{% url "users:password_reset" %}'>Изменить пароль</a></p>
</form>
{% endblock content %}
